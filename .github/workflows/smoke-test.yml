name: Almanac Miner Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout miner repo
        uses: actions/checkout@v4

      - name: Checkout upstream Almanac
        uses: actions/checkout@v4
        with:
          repository: corvxai/almanac
          path: almanac
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic

      - name: Run offline smoke tests
        env:
          ALMANAC_REPO: ${{ github.workspace }}/almanac
        run: python test_agents.py

      - name: Compile miner files
        run: |
          python -m py_compile phase1_starter.py
          python -m py_compile phase2_research.py
